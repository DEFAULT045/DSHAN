name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - - name: 安装 SDK / NDK / CMake
        shell: pwsh
        run: |
          $sm = "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat"
          "y`n" * 20 | & $sm --licenses | Out-Null
          & $sm "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1" "ndk;26.1.10909125"
      - uses: gradle/actions/setup-gradle@v4

      - name: 下载并校验 Node 运行时
        shell: pwsh
        run: |
          npx --yes node@24 --version
          ./scripts/fetch-node.ps1

      - name: 安装 runtime 依赖
        shell: pwsh
        run: npm ci --prefix runtime --omit=dev --ignore-scripts --os=android --cpu=arm64 --libc=bionic

      - name: 准备运行时
        shell: pwsh
        run: ./scripts/prepare-runtime.ps1

      - name: 构建 Debug APK
        shell: pwsh
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: dshan-debug-apk
          path: app/build/outputs/apk/debug/*.apk
